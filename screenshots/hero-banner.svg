<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="55%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9A3412" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="1280" height="440" rx="24" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="1277" height="437" rx="22.5" stroke="#FED7AA" stroke-width="3"/>

  <!-- Subtle Geometric Grid Accent -->
  <g opacity="0.35" stroke="#FDBA74" stroke-width="1">
    <line x1="720" y1="0" x2="720" y2="440"/>
    <line x1="880" y1="0" x2="880" y2="440"/>
    <line x1="1040" y1="0" x2="1040" y2="440"/>
    <line x1="1200" y1="0" x2="1200" y2="440"/>
    <line x1="660" y1="110" x2="1280" y2="110"/>
    <line x1="660" y1="220" x2="1280" y2="220"/>
    <line x1="660" y1="330" x2="1280" y2="330"/>
  </g>

  <!-- Left Column: AuraConvert Brand Identity & Copy -->
  <g transform="translate(72, 68)">
    <!-- AuraNix Badge -->
    <rect x="0" y="0" width="236" height="34" rx="17" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="6" fill="url(#orangeGrad)"/>
    <text x="36" y="22" fill="#C2410C" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">AURANIX TECHNOLOGIES</text>

    <!-- Brand Logo + Title -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#orangeGrad)"/>
      <path d="M18 14H34L44 24V46C44 47.1046 43.1046 48 42 48H18C16.8954 48 16 47.1046 16 46V16C16 14.8954 16.8954 14 18 14Z" fill="#FFFFFF"/>
      <path d="M33 14V23C33 24.1046 33.8954 25 35 25H44" fill="#FFEDD5"/>
      <path d="M23 32L20 35L23 38M31 32L34 35L31 38M28 30L26 40" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="45" fill="#18181B" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-0.03em">AuraConvert</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="168" fill="#EA580C" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="-0.01em">
      Convert HTML to PDF. Fast, Beautiful, Effortless.
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="208" fill="#52525B" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="500">
      Split HTML &amp; CSS code editors, real-time proportional multi-page preview,
    </text>
    <text x="0" y="232" fill="#52525B" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="500">
      and headless Chromium vector PDF generation with custom page geometry.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 266)">
      <rect x="0" y="0" width="142" height="36" rx="10" fill="url(#orangeGrad)"/>
      <text x="22" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Vector Text PDF</text>

      <rect x="154" y="0" width="166" height="36" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
      <text x="174" y="23" fill="#9A3412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">A4 · A3 · A5 · Custom</text>

      <rect x="332" y="0" width="154" height="36" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
      <text x="352" y="23" fill="#9A3412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Split HTML &amp; CSS</text>
    </g>
  </g>

  <!-- Right Column: Visual Diagram (HTML/CSS Code Card -> Arrow -> Vector PDF Sheet) -->
  <!-- Code Card -->
  <g transform="translate(690, 66)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="296" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
    <!-- Window Bar -->
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    <text x="74" y="24" fill="#A1A1AA" font-family="monospace" font-size="11" font-weight="600">HTML + CSS</text>
    <line x1="0" y1="38" x2="240" y2="38" stroke="#27272A" stroke-width="1.5"/>

    <!-- Code Lines -->
    <text x="18" y="66" fill="#F97316" font-family="monospace" font-size="12">&lt;header class="doc"&gt;</text>
    <text x="30" y="88" fill="#60A5FA" font-family="monospace" font-size="12">&lt;h1&gt;</text>
    <text x="64" y="88" fill="#F4F4F5" font-family="monospace" font-size="12">AuraConvert</text>
    <text x="150" y="88" fill="#60A5FA" font-family="monospace" font-size="12">&lt;/h1&gt;</text>
    <text x="18" y="110" fill="#F97316" font-family="monospace" font-size="12">&lt;/header&gt;</text>

    <line x1="18" y1="130" x2="222" y2="130" stroke="#27272A" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="18" y="154" fill="#FDBA74" font-family="monospace" font-size="12">@page {</text>
    <text x="32" y="176" fill="#A1A1AA" font-family="monospace" font-size="12">size: A4 portrait;</text>
    <text x="32" y="198" fill="#A1A1AA" font-family="monospace" font-size="12">margin: 15mm;</text>
    <text x="18" y="220" fill="#FDBA74" font-family="monospace" font-size="12">}</text>

    <rect x="18" y="242" width="204" height="34" rx="8" fill="#27272A"/>
    <text x="44" y="263" fill="#FB923C" font-family="monospace" font-size="11" font-weight="700">Playwright Engine</text>
  </g>

  <!-- Conversion Connector Badge -->
  <g transform="translate(918, 190)" filter="url(#cardShadow)">
    <circle cx="28" cy="28" r="28" fill="url(#orangeGrad)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M20 28H36M36 28L30 22M36 28L30 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- PDF Document Sheet Card -->
  <g transform="translate(962, 52)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="332" rx="14" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
    <!-- PDF Badge Header -->
    <rect x="22" y="24" width="54" height="22" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <text x="32" y="39" fill="#EA580C" font-family="system-ui, sans-serif" font-size="11" font-weight="800">PDF</text>
    <text x="164" y="39" fill="#71717A" font-family="monospace" font-size="11" font-weight="600">210×297mm</text>

    <text x="22" y="76" fill="#18181B" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Architecture Spec</text>
    <rect x="22" y="88" width="206" height="3" rx="1.5" fill="#EA580C"/>

    <!-- Simulated Vector Content Blocks -->
    <rect x="22" y="106" width="190" height="8" rx="4" fill="#E4E4E7"/>
    <rect x="22" y="122" width="165" height="8" rx="4" fill="#E4E4E7"/>

    <!-- Mini Metric Boxes -->
    <rect x="22" y="146" width="64" height="44" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="32" y="164" fill="#9A3412" font-family="system-ui, sans-serif" font-size="9" font-weight="600">FORMAT</text>
    <text x="32" y="180" fill="#EA580C" font-family="monospace" font-size="12" font-weight="700">ISO A4</text>

    <rect x="93" y="146" width="64" height="44" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="103" y="164" fill="#9A3412" font-family="system-ui, sans-serif" font-size="9" font-weight="600">OUTPUT</text>
    <text x="103" y="180" fill="#EA580C" font-family="monospace" font-size="12" font-weight="700">300 DPI</text>

    <rect x="164" y="146" width="64" height="44" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="174" y="164" fill="#9A3412" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TEXT</text>
    <text x="174" y="180" fill="#EA580C" font-family="monospace" font-size="12" font-weight="700">Vector</text>

    <!-- Table Rows -->
    <rect x="22" y="206" width="206" height="18" rx="4" fill="#F4F4F5"/>
    <rect x="22" y="232" width="206" height="12" rx="3" fill="#FAFAFA"/>
    <rect x="22" y="252" width="206" height="12" rx="3" fill="#FAFAFA"/>

    <!-- Ready Pill at Bottom of Sheet -->
    <rect x="22" y="282" width="206" height="32" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="42" cy="298" r="7" fill="#10B981"/>
    <path d="M39 298L41 300L45 296" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="302" fill="#065F46" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Ready to Download PDF</text>
  </g>
</svg>
